server {
    listen 80;
    server_name matthieu-vinet.fr;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://formspree.io;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    location / { try_files $uri $uri/ =404; }
}
